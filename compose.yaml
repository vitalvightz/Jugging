name: unlxck-backend

services:
  api:
    build:
      context: .
    command: uvicorn api.app:app --host 0.0.0.0 --port 8000 --workers 1
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      UNLXCK_ENABLE_IN_PROCESS_GENERATION: "0"
      UNLXCK_DISABLE_SPACY: "1"
      UNLXCK_FIGHT_CAMP_NOTIFICATIONS_MODE: "send"
      APP_RSS_WARN_MB: "700"
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          (test -f /tmp/unlxck-xp-hardening-ready ||
          (python tools/check_xp_hardening_rollout.py &&
          touch /tmp/unlxck-xp-hardening-ready)) &&
          curl --fail --silent http://127.0.0.1:8000/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  worker:
    build:
      context: .
    command: python -m api.worker
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      UNLXCK_ENABLE_IN_PROCESS_GENERATION: "0"
      UNLXCK_DISABLE_SPACY: "0"
      UNLXCK_FIGHT_CAMP_NOTIFICATIONS_MODE: "send"
      UNLXCK_GENERATION_WORKER_MAX_CONCURRENT_JOBS: "1"
      UNLXCK_GENERATION_WORKER_SHUTDOWN_GRACE_SECONDS: "35"
    stop_grace_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    env_file:
      - .env.production
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # The directory, not the single file: the deploy replaces the Caddyfile
      # (git reset --hard writes a new inode) and a single-file bind mount keeps
      # serving the old one, so `caddy reload` silently re-read stale config.
      - ./caddy:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  caddy_data:
  caddy_config:
