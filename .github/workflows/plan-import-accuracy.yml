name: Plan Import Accuracy

# Sends the hand-checked programmes in tests/fixtures/plan_import to the real
# import model and lists every difference from the hand-checked reading.
# Needs an OPENAI_API_KEY repository secret. One model call per programme;
# nothing in production is touched. Run it by hand before launch and after any
# change to the import prompt or model.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    name: Compare the real model with hand-checked programmes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11.15"
          cache: "pip"
          cache-dependency-path: requirements.txt
      - name: Install
        run: pip install -r requirements.txt
      - name: Run the accuracy check
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          UNLXCK_PLAN_IMPORT_MODEL: ${{ vars.UNLXCK_PLAN_IMPORT_MODEL }}
        run: |
          set -o pipefail
          # Exit 1 means differences were found; the report says which.
          python tools/plan_import_eval.py | tee "$RUNNER_TEMP/report.txt"
      - name: Summary
        if: always()
        run: |
          { echo '### Plan import accuracy'; echo '```'; cat "$RUNNER_TEMP/report.txt" 2>/dev/null || echo "No report."; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
