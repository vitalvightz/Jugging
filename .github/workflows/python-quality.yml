name: Python Quality

on:
  push:
    branches:
      - Main
  pull_request:
    branches:
      - "**"

# Keep only the newest Python Quality run for a branch / PR. Old commits are
# obsolete once a newer commit exists, and letting every full-suite pytest job
# continue can exhaust the hosted-runner queue.
concurrency:
  group: python-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11.15"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install lint dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run Ruff
        run: ruff check api fightcamp tests tools

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11.15"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit

      - name: Audit runtime dependencies for known vulnerabilities
        run: pip-audit -r requirements.txt

  test-full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11.15"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install test dependencies
        env:
          # Give pip its own network resilience; the loop below is the belt-and-
          # braces for a transient 5xx on the GitHub-hosted en_core_web_sm wheel.
          PIP_RETRIES: "5"
          PIP_DEFAULT_TIMEOUT: "60"
        run: |
          python -m pip install --upgrade pip
          n=0
          until pip install -r requirements-dev.txt; do
            n=$((n + 1))
            if [ "$n" -ge 3 ]; then
              echo "pip install failed after $n attempts"; exit 1
            fi
            echo "Transient install failure; retry $n in $((n * 15))s..."; sleep $((n * 15))
          done
          pip check

      - name: Run full pytest suite
        env:
          PYTEST_SHARD: ${{ matrix.shard }}
        # Round-robin modules cover the same default pytest filename patterns,
        # once each. Main's unsharded suite exhausted 20 minutes at 39%.
        run: |
          python - <<'PY'
          import os
          import pathlib
          import subprocess
          import sys
          files = sorted(p for p in pathlib.Path("tests").rglob("*.py")
                         if p.match("test_*.py") or p.match("*_test.py"))
          selected = files[int(os.environ["PYTEST_SHARD"])::6]
          assert selected, "every full-suite shard must contain tests"
          # loadfile keeps each module on one worker so module-level plan
          # caches are generated once rather than once per worker.
          sys.exit(subprocess.call([sys.executable, "-m", "pytest", "-q", "-n", "auto",
                                    "--dist", "loadfile", *map(str, selected)]))
          PY

  test-runtime-surfaces:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11.15"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install runtime + test dependencies
        env:
          # See test-full-suite: retry a transient 5xx on the GitHub-hosted wheel.
          PIP_RETRIES: "5"
          PIP_DEFAULT_TIMEOUT: "60"
        run: |
          python -m pip install --upgrade pip
          n=0
          until pip install -r requirements-dev.txt; do
            n=$((n + 1))
            if [ "$n" -ge 3 ]; then
              echo "pip install failed after $n attempts"; exit 1
            fi
            echo "Transient install failure; retry $n in $((n * 15))s..."; sleep $((n * 15))
          done
          pip check

      - name: Run generation/runtime regression suite
        run: |
          pytest -q \
            tests/test_api_generation_flows.py \
            tests/test_generation_runtime.py
