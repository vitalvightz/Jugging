name: Backend Checks

# Runs the runtime schema checker and real PostgreSQL rehab concurrency/report
# tests. The full backend suite remains in python-quality.yml.
#
# The LIVE Supabase runtime schema check below may skip on PRs and non-Main/main
# branches without credentials, but it is mandatory on every push to Main/main
# (protected or not). deploy-hetzner.yml runs the same gate before deploying.

on:
  push:
    branches:
      - Main
  pull_request:
    branches:
      - "**"

concurrency:
  group: backend-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rehab-lock-concurrency:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_PASSWORD: rehab_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11.15"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install PostgreSQL test dependencies
        run: pip install -r requirements-dev.txt
      - name: Exercise real PostgreSQL concurrency, publication and Open Plan XP
        env:
          REHAB_TEST_DATABASE_URL: postgresql://postgres:rehab_test_only@127.0.0.1:5432/postgres
        run: |
          pytest tests/test_rehab_lock_concurrency.py tests/test_clinical_review_capture_postgres.py tests/test_intake_injury_sync_postgres.py tests/test_custom_plan_publication_postgres.py tests/test_open_plan_xp_postgres.py tests/test_tracking_xp_postgres.py tests/test_sparring_log_postgres.py tests/test_plan_free_checkin_postgres.py tests/test_first_camp_timezone.py tests/test_manual_exercise_entries_postgres.py -q
          python tools/test_coach_workspace.py --container ${{ job.services.postgres.id }}

  pytest:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11.15"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run runtime schema checker tests
        run: pytest tests/test_supabase_runtime_schema_checker.py tests/test_supabase_schema.py

      # The public Library and Edit/Swap share this strict source catalogue.
      # Fail the fast backend check before stale manifest bindings can ship.
      - name: Load the exact training catalogue used by Library and Edit/Swap
        run: python -c "from api.services.training_library import cache; print('Catalogue entries:', len(cache.get().records))"

      # The service-role key is scoped to THIS step's env so the install/test
      # steps above never see it. The gate only permits missing credentials on
      # PRs or non-Main/main branch runs; Main/main pushes must run the live
      # check and pass.
      - name: Live Supabase runtime schema check (staging)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python tools/run_supabase_runtime_schema_gate.py
